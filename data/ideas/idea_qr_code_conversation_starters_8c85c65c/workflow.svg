<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="615" viewBox="0 0 1000 615">
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>.title{font:700 22px Arial;fill:#0f172a}.box{fill:#fff;stroke:#6366f1;stroke-width:2}.label{font:600 14px Arial;fill:#0f172a}.small{font:12px Arial;fill:#475569}.edge{stroke:#64748b;stroke-width:2;fill:none}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text x="32" y="36" class="title">Workflow</text>
<rect x="90" y="70" width="820" height="70" rx="12" class="box"/>
<text x="115" y="98" class="label">Step 1: User A generates and displays their digital networking QR code containing their</text>
<text x="115" y="118" class="label">professional profile and interests.</text>
<line x1="500" y1="140" x2="500" y2="175" class="edge" marker-end="url(#arrow)"/>
<rect x="90" y="175" width="820" height="70" rx="12" class="box"/>
<text x="115" y="203" class="label">Step 2: User B scans User A&#x27;s QR code using their mobile device camera or companion app.</text>
<line x1="500" y1="245" x2="500" y2="280" class="edge" marker-end="url(#arrow)"/>
<rect x="90" y="280" width="820" height="70" rx="12" class="box"/>
<text x="115" y="308" class="label">Step 3: The system extracts profile data for both users and queries an AI engine to find</text>
<text x="115" y="328" class="label">common interests and context.</text>
<line x1="500" y1="350" x2="500" y2="385" class="edge" marker-end="url(#arrow)"/>
<rect x="90" y="385" width="820" height="70" rx="12" class="box"/>
<text x="115" y="413" class="label">Step 4: The system dynamically generates tailored conversation starters displayed on User</text>
<text x="115" y="433" class="label">B&#x27;s screen.</text>
<line x1="500" y1="455" x2="500" y2="490" class="edge" marker-end="url(#arrow)"/>
<rect x="90" y="490" width="820" height="70" rx="12" class="box"/>
<text x="115" y="518" class="label">Step 5: Users engage in the conversation, with the option to save contacts or log the</text>
<text x="115" y="538" class="label">interaction for follow-up.</text>
</svg>