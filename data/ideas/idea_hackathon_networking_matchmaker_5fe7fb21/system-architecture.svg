<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>.title{font:700 22px Arial;fill:#0f172a}.box{fill:#fff;stroke:#6366f1;stroke-width:2}.label{font:600 14px Arial;fill:#0f172a}.small{font:12px Arial;fill:#475569}.edge{stroke:#64748b;stroke-width:2;fill:none}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text x="32" y="36" class="title">System Architecture</text>
<line x1="730" y1="665" x2="830" y2="125" class="edge" marker-end="url(#arrow)"/>
<text x="780.0" y="383.0" class="small">Batch attendee export (CSV/API)</text>
<line x1="1110" y1="125" x2="830" y2="485" class="edge" marker-end="url(#arrow)"/>
<text x="970.0" y="293.0" class="small">Persists initial participant records</text>
<line x1="350" y1="125" x2="450" y2="125" class="edge" marker-end="url(#arrow)"/>
<text x="400.0" y="113.0" class="small">Chat turns, match queries, QR badge scan</text>
<line x1="730" y1="125" x2="70" y2="305" class="edge" marker-end="url(#arrow)"/>
<text x="400.0" y="203.0" class="small">Delegates onboarding chat turns</text>
<line x1="350" y1="305" x2="70" y2="665" class="edge" marker-end="url(#arrow)"/>
<text x="210.0" y="473.0" class="small">Reads/writes session conversation context</text>
<line x1="350" y1="305" x2="450" y2="305" class="edge" marker-end="url(#arrow)"/>
<text x="400.0" y="293.0" class="small">Generates adaptive interview questions &amp; extracts summary</text>
<line x1="350" y1="305" x2="830" y2="485" class="edge" marker-end="url(#arrow)"/>
<text x="590.0" y="383.0" class="small">Saves finalized structured persona &amp; preferences</text>
<line x1="1110" y1="485" x2="830" y2="305" class="edge" marker-end="url(#arrow)"/>
<text x="970.0" y="383.0" class="small">Triggers vectorization on profile update</text>
<line x1="1110" y1="305" x2="450" y2="305" class="edge" marker-end="url(#arrow)"/>
<text x="780.0" y="293.0" class="small">Requests text embeddings</text>
<line x1="1110" y1="305" x2="830" y2="485" class="edge" marker-end="url(#arrow)"/>
<text x="970.0" y="383.0" class="small">Stores vector embeddings in pgvector</text>
<line x1="730" y1="125" x2="70" y2="485" class="edge" marker-end="url(#arrow)"/>
<text x="400.0" y="293.0" class="small">Requests recommendations or network graph</text>
<line x1="350" y1="485" x2="830" y2="485" class="edge" marker-end="url(#arrow)"/>
<text x="590.0" y="473.0" class="small">Executes ANN vector search and relational filters</text>
<line x1="350" y1="485" x2="70" y2="665" class="edge" marker-end="url(#arrow)"/>
<text x="210.0" y="563.0" class="small">Caches calculated clusters and match pairs</text>
<line x1="730" y1="125" x2="450" y2="485" class="edge" marker-end="url(#arrow)"/>
<text x="590.0" y="293.0" class="small">QR scan lookup with target user ID</text>
<line x1="730" y1="485" x2="830" y2="485" class="edge" marker-end="url(#arrow)"/>
<text x="780.0" y="473.0" class="small">Fetches both participant profiles</text>
<line x1="730" y1="485" x2="450" y2="305" class="edge" marker-end="url(#arrow)"/>
<text x="590.0" y="383.0" class="small">Synthesizes shared context &amp; starter prompts</text>
<line x1="730" y1="485" x2="70" y2="125" class="edge" marker-end="url(#arrow)"/>
<text x="400.0" y="293.0" class="small">Returns instant personalized conversation starters</text>
<rect x="70" y="75" width="280" height="100" rx="12" class="box"/>
<text x="88" y="105" class="label">Participant Web App</text>
<text x="88" y="130" class="small">Mobile-first PWA providing</text>
<text x="88" y="147" class="small">conversational onboarding chat,</text>
<rect x="450" y="75" width="280" height="100" rx="12" class="box"/>
<text x="468" y="105" class="label">API Gateway &amp; Router</text>
<text x="468" y="130" class="small">Handles authentication, participant</text>
<text x="468" y="147" class="small">routing, QR code resolution, and</text>
<rect x="830" y="75" width="280" height="100" rx="12" class="box"/>
<text x="848" y="105" class="label">Organizer Data Ingest Worker</text>
<text x="848" y="130" class="small">Ingests baseline registration rosters</text>
<text x="848" y="147" class="small">and survey CSVs from platforms like</text>
<rect x="70" y="255" width="280" height="100" rx="12" class="box"/>
<text x="88" y="285" class="label">Conversational Profiler Service</text>
<text x="88" y="310" class="small">Orchestrates multi-turn dialogue with</text>
<text x="88" y="327" class="small">participants to extract implicit</text>
<rect x="450" y="255" width="280" height="100" rx="12" class="box"/>
<text x="468" y="285" class="label">Foundation LLM API</text>
<text x="468" y="310" class="small">Executes profiling prompt chains,</text>
<text x="468" y="327" class="small">context extraction, text</text>
<rect x="830" y="255" width="280" height="100" rx="12" class="box"/>
<text x="848" y="285" class="label">Embedding Generator</text>
<text x="848" y="310" class="small">Generates dense vector embeddings for</text>
<text x="848" y="327" class="small">extracted participant profiles,</text>
<rect x="70" y="435" width="280" height="100" rx="12" class="box"/>
<text x="88" y="465" class="label">Hybrid Matching Engine</text>
<text x="88" y="490" class="small">Computes cosine distance via pgvector</text>
<text x="88" y="507" class="small">combined with deterministic heuristic</text>
<rect x="450" y="435" width="280" height="100" rx="12" class="box"/>
<text x="468" y="465" class="label">Contextual Icebreaker Service</text>
<text x="468" y="490" class="small">Synthesizes pairwise profile insights</text>
<text x="468" y="507" class="small">to craft contextual conversation</text>
<rect x="830" y="435" width="280" height="100" rx="12" class="box"/>
<text x="848" y="465" class="label">PostgreSQL + pgvector</text>
<text x="848" y="490" class="small">Primary datastore maintaining</text>
<text x="848" y="507" class="small">participant profiles, structured</text>
<rect x="70" y="615" width="280" height="100" rx="12" class="box"/>
<text x="88" y="645" class="label">Redis Cache &amp; Session Store</text>
<text x="88" y="670" class="small">Maintains ephemeral chat session</text>
<text x="88" y="687" class="small">states for onboarding conversations</text>
<rect x="450" y="615" width="280" height="100" rx="12" class="box"/>
<text x="468" y="645" class="label">Organizer Registration Data</text>
<text x="468" y="670" class="small">External attendee data sources (Luma,</text>
<text x="468" y="687" class="small">Typeform, Eventbrite, or CSV dumps).</text>
</svg>